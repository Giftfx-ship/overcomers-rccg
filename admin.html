<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin - RCCG Overcomers HOC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f9;
            min-height: 100vh;
            display: flex;
        }

        .loader-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a3a5c;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 99999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .loader-wrapper.hidden { opacity: 0; visibility: hidden; }
        .loader {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loader-text { color: #fff; margin-top: 15px; font-size: 0.8rem; opacity: 0.6; }

        #loginPage {
            display: flex;
            width: 100%;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a3a5c 0%, #2c5f8a 100%);
            padding: 20px;
        }
        #loginPage.hidden { display: none; }
        .login-box {
            background: #fff;
            padding: 45px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            animation: fadeUp 0.8s ease forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-box .logo { text-align: center; margin-bottom: 25px; }
        .login-box .logo i { font-size: 2.5rem; color: #1a3a5c; margin-bottom: 10px; }
        .login-box .logo h2 { color: #1a3a5c; font-size: 1.2rem; }
        .login-box .logo p { color: #7a8a9a; font-size: 0.8rem; }
        .login-box .form-group { margin-bottom: 18px; }
        .login-box label { display: block; font-weight: 600; margin-bottom: 5px; color: #2c3e50; font-size: 0.9rem; }
        .login-box input {
            width: 100%;
            padding: 11px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.3s ease;
        }
        .login-box input:focus { outline: none; border-color: #1a3a5c; }
        .login-box .btn {
            width: 100%;
            padding: 13px;
            background: #1a3a5c;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
